name: Pruebas unitarias sin modelos

on:
  push:
    branches: [mejoras-modulos-vial-conductual]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Descargar repositorio sin archivos grandes LFS
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Comprobar sintaxis
        run: python -m compileall -q modules tests scripts
      - name: Ejecutar pruebas puras
        run: python -m unittest discover -s tests -v
